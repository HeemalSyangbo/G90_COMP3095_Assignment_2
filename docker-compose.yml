version: "3.9"

services:
  # --- Datastores ---
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: wellness
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d wellness"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"

  mongo:
    image: mongo:7
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  # --- Wellness microservice (Postgres + Redis + Kafka consumer) ---
  wellness-resource-service:
    build:
      context: ./wellness-resource-service
    image: wellness-resource-service:1.0.0
    container_name: wellness-resource-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:          # 👈 wait for Kafka too
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/wellness
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: "6379"
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092   # 👈 make sure listener points to Kafka
      SERVER_PORT: "8081"
    ports:
      - "8081:8081"

  # --- Event DB ---
  event-db:
    image: postgres:16-alpine
    container_name: event-db
    environment:
      POSTGRES_DB: eventdb
      POSTGRES_USER: event_user
      POSTGRES_PASSWORD: event_pass
    ports:
      - "5435:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U event_user -d eventdb" ]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - eventdb_data:/var/lib/postgresql/data

  # --- Event Service (Kafka producer) ---
  event-service:
    build:
      context: ./event-service
    container_name: event-service
    depends_on:
      event-db:
        condition: service_healthy
      wellness-resource-service:
        condition: service_started
      kafka:          # 👈 wait for Kafka
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://event-db:5432/eventdb
      SPRING_DATASOURCE_USERNAME: event_user
      SPRING_DATASOURCE_PASSWORD: event_pass
      SERVER_PORT: 8083
      WELLNESS_BASE_URL: http://wellness-resource-service:8081
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092   # 👈 producer points to Kafka
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8083/actuator/health"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- Goal microservice (Mongo) ---
  goal-tracking-service:
    build:
      context: ./goal-tracking-service
    image: goal-tracking-service:latest
    container_name: goal-tracking-service
    depends_on:
      mongo:
        condition: service_started
      wellness-resource-service:
        condition: service_started
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/goaltracking
      SERVER_PORT: 8082
      WELLNESS_BASE_URL: http://wellness-resource-service:8081
    ports:
      - "8082:8082"

  # --- API Gateway ---
  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    depends_on:
      wellness-resource-service:
        condition: service_started
      goal-tracking-service:
        condition: service_started
      event-service:
        condition: service_started
    ports:
      - "8080:8080"

  keycloak-db:
    image: postgres:16
    container_name: keycloak-db
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    volumes:
      - keycloak_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: [ "start-dev" ]
    depends_on:
      keycloak-db:
        condition: service_started
    ports:
      - "8085:8080"

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"


  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1


volumes:
  pg_data:
  mongo_data:
  eventdb_data:
  keycloak_data:
