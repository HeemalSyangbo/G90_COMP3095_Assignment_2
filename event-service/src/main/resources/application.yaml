server:
  port: 8083

spring:
  application:
    name: event-service

  datasource:
    url: jdbc:postgresql://event-db:5432/eventdb   # inside docker
    username: event_user
    password: event_pass

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

  kafka:
    bootstrap-servers: kafka:9092      # 🔴 IMPORTANT: service name, NOT localhost
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

management:
  endpoints:
    web:
      exposure:
        include: health,info
