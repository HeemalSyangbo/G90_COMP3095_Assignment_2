server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        # Wellness resources
        - id: wellness-service
          uri: http://wellness-resource-service:8081
          predicates:
            - Path=/api/resources/**
          filters:
            - StripPrefix=1

        # Goals
        - id: goal-tracking-service
          uri: http://goal-tracking-service:8082
          predicates:
            - Path=/api/goals/**
          filters:
            - StripPrefix=1

        # Events  🔧 FIXED: no StripPrefix so `/api/events` reaches controller
        - id: event-service
          uri: http://event-service:8083
          predicates:
            - Path=/api/events/**
          # (no StripPrefix here)

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://keycloak:8080/realms/wellness-realm/protocol/openid-connect/certs

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never
